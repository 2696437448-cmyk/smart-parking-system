name: 功能建议
description: 提交一个新功能或优化建议
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: background
    attributes:
      label: 背景与问题
      description: 当前遇到的问题或使用场景是什么
      placeholder: 例如：物业端经营图表缺少按区域筛选能力
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 请描述你希望新增或改进的内容
      placeholder: 例如：增加区域筛选器，并支持切换日/周/月趋势
    validations:
      required: true
  - type: textarea
    id: value
    attributes:
      label: 预期收益
      description: 这个改动能解决什么问题
      placeholder: 例如：提升物业端分析效率，方便对比不同区域经营情况
    validations:
      required: false
  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 可填写参考设计、接口建议或其他说明
    validations:
      required: false
